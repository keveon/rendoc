spring:
  application:
    name: rendoc
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:sqlite:${RENDOC_DB_PATH:/var/lib/rendoc/rendoc.db}
    driver-class-name: org.sqlite.JDBC
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

rendoc:
  security:
    api-token: ${RENDOC_API_TOKEN}
  conversion:
    max-input-bytes: ${RENDOC_MAX_INPUT_BYTES:20971520}
    max-in-flight: ${RENDOC_MAX_IN_FLIGHT:2}
    working-directory: ${RENDOC_WORK_DIR:/var/lib/rendoc/work}
  libreoffice:
    office-home: ${RENDOC_LIBREOFFICE_HOME:}
    working-directory: ${RENDOC_LIBREOFFICE_WORK_DIR:/var/lib/rendoc/libreoffice}
    port: ${RENDOC_LIBREOFFICE_PORT:2002}
    max-tasks-per-process: ${RENDOC_MAX_TASKS_PER_PROCESS:20}
    process-timeout: ${RENDOC_PROCESS_TIMEOUT:120s}
    task-queue-timeout: ${RENDOC_TASK_QUEUE_TIMEOUT:30s}
    task-execution-timeout: ${RENDOC_TASK_EXECUTION_TIMEOUT:120s}
  jobs:
    enabled: ${RENDOC_JOBS_ENABLED:true}
    max-batch-size: ${RENDOC_MAX_BATCH_SIZE:200}
    poll-interval: ${RENDOC_JOB_POLL_INTERVAL:5s}
    retention: ${RENDOC_JOB_RETENTION:24h}
    cleanup-interval: ${RENDOC_JOB_CLEANUP_INTERVAL:1h}
    output-dir: ${RENDOC_JOB_OUTPUT_DIR:/var/lib/rendoc/jobs}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
      show-details: never
      group:
        readiness:
          include: readinessState,libreOffice
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true

server:
  shutdown: graceful
  forward-headers-strategy: framework

spring.lifecycle.timeout-per-shutdown-phase: 30s
