services:
  rendoc:
    image: ${RENDOC_IMAGE:-ghcr.io/keveon/rendoc:latest}
    build:
      context: .
    environment:
      RENDOC_API_TOKEN: ${RENDOC_API_TOKEN:?RENDOC_API_TOKEN is required}
    ports:
      - "127.0.0.1:${RENDOC_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
      - /var/lib/rendoc:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
