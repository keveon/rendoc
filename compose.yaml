services:
  rendoc:
    image: ${RENDOC_IMAGE:-ghcr.io/keveon/rendoc:latest}
    build:
      context: .
    environment:
      RENDOC_API_TOKEN: ${RENDOC_API_TOKEN:?RENDOC_API_TOKEN is required}
      RENDOC_MAX_INPUT_BYTES: ${RENDOC_MAX_INPUT_BYTES:-20971520}
      RENDOC_MAX_IN_FLIGHT: ${RENDOC_MAX_IN_FLIGHT:-2}
      RENDOC_WORK_DIR: ${RENDOC_WORK_DIR:-/var/lib/rendoc/work}
      RENDOC_LIBREOFFICE_HOME: ${RENDOC_LIBREOFFICE_HOME:-}
      RENDOC_LIBREOFFICE_WORK_DIR: ${RENDOC_LIBREOFFICE_WORK_DIR:-/var/lib/rendoc/libreoffice}
      RENDOC_LIBREOFFICE_PORT: ${RENDOC_LIBREOFFICE_PORT:-2002}
      RENDOC_MAX_TASKS_PER_PROCESS: ${RENDOC_MAX_TASKS_PER_PROCESS:-20}
      RENDOC_PROCESS_TIMEOUT: ${RENDOC_PROCESS_TIMEOUT:-120s}
      RENDOC_TASK_QUEUE_TIMEOUT: ${RENDOC_TASK_QUEUE_TIMEOUT:-30s}
      RENDOC_TASK_EXECUTION_TIMEOUT: ${RENDOC_TASK_EXECUTION_TIMEOUT:-120s}
    ports:
      - "127.0.0.1:${RENDOC_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m,uid=10001,gid=10001,mode=1770
      - /var/lib/rendoc:rw,noexec,nosuid,nodev,size=512m,uid=10001,gid=10001,mode=0750
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    restart: unless-stopped
